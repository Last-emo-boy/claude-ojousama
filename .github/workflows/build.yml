name: Desktop builds

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64-unsigned
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64-unnotarized
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64-unnotarized
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:helpers
      - run: npm test
      - run: npm run check
      - name: Install isolated X11 test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 libx11-6 xvfb xauth openbox x11-utils wmctrl tesseract-ocr tesseract-ocr-eng
      - name: Exercise native Linux windows and OCR
        if: runner.os == 'Linux'
        run: xvfb-run -a env OJOUSAMA_NATIVE_X11_TEST=1 python3 tests/linux-native.test.py
      - run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          retention-days: 14

  # Only a published release gets a job with write access: it attaches the four builds' installers.
  release:
    name: Attach installers to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(installers/*.exe installers/*.zip installers/*.dmg installers/*.AppImage installers/*.deb)
          [ ${#files[@]} -gt 0 ] || { echo "no installers"; exit 1; }
          ls -la installers
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
