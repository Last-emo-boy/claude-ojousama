name: Tauri prototype

on:
  push:
    branches: [main, 'codex/**']
    paths: ['prototypes/tauri-pet/**', 'assets/sprites/**', 'assets/icon-256.png', 'assets/companion-defaults.json', 'assets/observation-policy.json', '.github/workflows/tauri-prototype.yml']
  pull_request:
    paths: ['prototypes/tauri-pet/**', 'assets/sprites/**', 'assets/icon-256.png', 'assets/companion-defaults.json', 'assets/observation-policy.json', '.github/workflows/tauri-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            artifact: lite-windows-x64-unsigned
          - name: macOS Apple Silicon
            os: macos-15
            artifact: lite-macos-arm64-unnotarized
          - name: macOS Intel
            os: macos-15-intel
            artifact: lite-macos-x64-unnotarized
          - name: Linux x64
            os: ubuntu-24.04
            artifact: lite-linux-x64
    defaults:
      run:
        working-directory: prototypes/tauri-pet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set build directory
        shell: bash
        run: printf 'CARGO_TARGET_DIR=%s/ojousama-lite-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: prototypes/tauri-pet/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth openbox libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev libegl1-mesa-dev libclang-dev
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: runner.os != 'Linux'
      - name: Test native X11 window geometry
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a sh -c 'openbox >/tmp/ojousama-openbox.log 2>&1 & wm=$!; trap "kill $wm" EXIT; cargo test --manifest-path src-tauri/Cargo.toml --locked'
      - run: npm run build -- --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/dmg/*.dmg
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/deb/*.deb
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/appimage/*.AppImage
